[package]
name = "core-sandbox"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "OS sandbox drivers for tool execution"

[dependencies]
thiserror = "2"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = { version = "0.4" }
seccompiler = { version = "0.5" }
libc = { version = "0.2" }

[target.'cfg(target_os = "macos")'.dependencies]
libc = { version = "0.2" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Isolation", "Win32_System_JobObjects", "Win32_System_Threading"] }
