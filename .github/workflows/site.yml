name: site

# Cinematic product site (Astro static) on Cloudflare Pages (free tier).
# Path-filtered: runs only when the site, its budgets, its workflow, or
# its inputs (tokens, brand config) change. Main deploys production;
# PRs get preview deploys. Budgets are the blocking gate: a red budget
# fails this workflow before any deploy step runs.
on:
  push:
    branches: [main]
    paths:
      - 'apps/site/**'
      - 'scripts/site-budgets.mjs'
      - '.github/workflows/site.yml'
      - 'packages/ui/src/tokens/**'
      - 'branding.config.json'
  pull_request:
    paths:
      - 'apps/site/**'
      - 'scripts/site-budgets.mjs'
      - '.github/workflows/site.yml'
      - 'packages/ui/src/tokens/**'
      - 'branding.config.json'

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
      - run: corepack enable
      - run: corepack prepare pnpm@12.22.0 --activate
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lamakore/site build
      - name: budget gate (blocking)
        run: node scripts/site-budgets.mjs
      - name: ensure Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm exec wrangler pages project list 2>&1 | grep -q 'lamakore' \
            || pnpm exec wrangler pages project create lamakore --production-branch main
      - name: deploy production
        if: github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler pages deploy apps/site/dist --project-name lamakore --branch main
      - name: deploy preview
        if: github.event_name == 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler pages deploy apps/site/dist --project-name lamakore --branch "pr-${{ github.event.pull_request.number }}"
