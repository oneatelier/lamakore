name: scoreboard

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  scoreboard:
    name: scoreboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
      - name: regenerate parity scoreboard
        run: node scripts/gen-scoreboard.mjs
      - name: commit scoreboard if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/parity-scoreboard.md
          git diff --cached --quiet || git commit -m "chore(scoreboard): nightly parity scoreboard" && git push
