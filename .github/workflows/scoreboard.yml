name: scoreboard

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

# Nightly scoreboard: regenerates artifacts/parity-scoreboard.md and attaches
# it as a run artifact. It never commits (branch protection would reject a
# bot push without green checks, correctly) — the committed file stays the
# human-reviewed baseline; nightly runs carry fresh evidence as artifacts.
permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  scoreboard:
    name: scoreboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
      - name: regenerate parity scoreboard
        run: node scripts/gen-scoreboard.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: parity-scoreboard
          path: artifacts/parity-scoreboard.md
          if-no-files-found: error
