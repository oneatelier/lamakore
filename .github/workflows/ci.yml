name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
      - run: corepack enable
      - run: corepack prepare pnpm@12.22.0 --activate
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.100.0"
          components: rustfmt, clippy
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: explicit-any AST gate (blocking; word rules stay advisory)
        run: node scripts/detect-placeholders.mjs --any-only
      - run: cargo fmt --check
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo check --workspace
      - run: pnpm test
      - run: cargo test --workspace
      - run: cargo test -p core-sandbox --test tier1 -- --nocapture
      - run: cargo test -p vault --features mock-keyring -- --nocapture
      - run: cargo test -p cored --features mock-keyring
