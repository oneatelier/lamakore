name: hygiene

on:
  push:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  hygiene:
    name: hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
      - run: corepack enable
      - run: corepack prepare pnpm@12.22.0 --activate
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      - name: adopt pinned commit identity
        run: |
          NAME="$(node -p "require('./.hygiene/identity.json').name")"
          MAIL="$(node -p "require('./.hygiene/identity.json').email")"
          git config user.name "$NAME"
          git config user.email "$MAIL"
          git config user.name
          git config user.email
      - name: full-tree hygiene scan
        run: node scripts/hygiene/run-all.mjs
      - name: staged-author check on the pushed HEAD
        run: |
          HEAD_NAME="$(git log -1 --format='%an')"
          HEAD_EMAIL="$(git log -1 --format='%ae')"
          HEAD_CNAME="$(git log -1 --format='%cn')"
          HEAD_CEMAIL="$(git log -1 --format='%ce')"
          node scripts/hygiene/scan-author.mjs \
            --author-name "$HEAD_NAME" --author-email "$HEAD_EMAIL" \
            --committer-name "$HEAD_CNAME" --committer-email "$HEAD_CEMAIL"
