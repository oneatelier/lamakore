name: hygiene

on:
  push:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  hygiene:
    name: hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
      - run: corepack enable
      - run: corepack prepare pnpm@12.22.0 --activate
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      - name: adopt pinned commit identity
        run: |
          NAME="$(node -p "require('./.hygiene/identity.json').name")"
          MAIL="$(node -p "require('./.hygiene/identity.json').email")"
          git config user.name "$NAME"
          git config user.email "$MAIL"
          git config user.name
          git config user.email
      - name: full-tree hygiene scan (content scans always run, including dependabot PRs)
        run: node scripts/hygiene/run-all.mjs
      # Author-identity exemption is actor-gated (github.actor), NOT commit-string
      # gated: a human pushing commits with git-author "dependabot[bot]" still
      # fails this check when the step runs. Content scans above always run.
      # On pull_request events the checkout is the ephemeral merge commit, so
      # check the PR head SHA instead (fetched explicitly: shallow clones may
      # not contain it). The PR-event check is the strict gate: author AND
      # committer must be pinned (a spoofed dependabot author fails here).
      - name: staged-author check on the PR head SHA
        if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
        run: |
          git fetch --depth 1 origin "${{ github.event.pull_request.head.sha }}"
          TARGET="${{ github.event.pull_request.head.sha }}"
          HEAD_NAME="$(git log -1 --format='%an' "$TARGET")"
          HEAD_EMAIL="$(git log -1 --format='%ae' "$TARGET")"
          HEAD_CNAME="$(git log -1 --format='%cn' "$TARGET")"
          HEAD_CEMAIL="$(git log -1 --format='%ce' "$TARGET")"
          node scripts/hygiene/scan-author.mjs \
            --author-name "$HEAD_NAME" --author-email "$HEAD_EMAIL" \
            --committer-name "$HEAD_CNAME" --committer-email "$HEAD_CEMAIL"
      # On push events (post-merge main) check the landed author only.
      # GitHub's rebase-merge preserves the author but rewrites the committer
      # to the merger, so a pinned committer cannot hold here; the PR-event
      # gate above already vetted the full identity pre-merge. Dependabot
      # authors are allowed (future grouped patch/minor merges); spoofs
      # cannot reach main because the PR gate rejects them first.
      - name: landed-author check on the pushed HEAD
        if: github.event_name == 'push'
        run: |
          HEAD_NAME="$(git log -1 --format='%an' HEAD)"
          HEAD_EMAIL="$(git log -1 --format='%ae' HEAD)"
          node scripts/hygiene/scan-author.mjs --author-only --allow-bot-author \
            --author-name "$HEAD_NAME" --author-email "$HEAD_EMAIL"
