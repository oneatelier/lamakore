name: hygiene

on:
  push:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  hygiene:
    name: hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
      - run: corepack enable
      - run: corepack prepare pnpm@12.22.0 --activate
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      - name: adopt pinned commit identity
        run: |
          NAME="$(node -p "require('./.hygiene/identity.json').name")"
          MAIL="$(node -p "require('./.hygiene/identity.json').email")"
          git config user.name "$NAME"
          git config user.email "$MAIL"
          git config user.name
          git config user.email
      - name: full-tree hygiene scan (content scans always run, including dependabot PRs)
        run: node scripts/hygiene/run-all.mjs
      # Author-identity exemption is actor-gated (github.actor), NOT commit-string
      # gated: a human pushing commits with git-author "dependabot[bot]" still
      # fails this check when the step runs. Content scans above always run.
      # On pull_request events the checkout is the ephemeral merge commit, so
      # check the PR head SHA instead (fetched explicitly: shallow clones may
      # not contain it). On push events check HEAD (linear history: no merges).
      - name: staged-author check on the pushed HEAD
        if: github.actor != 'dependabot[bot]'
        run: |
          if [ -n "${{ github.event.pull_request.head.sha }}" ]; then
            git fetch --depth 1 origin "${{ github.event.pull_request.head.sha }}"
            TARGET="${{ github.event.pull_request.head.sha }}"
          else
            TARGET="HEAD"
          fi
          HEAD_NAME="$(git log -1 --format='%an' "$TARGET")"
          HEAD_EMAIL="$(git log -1 --format='%ae' "$TARGET")"
          HEAD_CNAME="$(git log -1 --format='%cn' "$TARGET")"
          HEAD_CEMAIL="$(git log -1 --format='%ce' "$TARGET")"
          node scripts/hygiene/scan-author.mjs \
            --author-name "$HEAD_NAME" --author-email "$HEAD_EMAIL" \
            --committer-name "$HEAD_CNAME" --committer-email "$HEAD_CEMAIL"
